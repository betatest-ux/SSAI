; SocialCareKit — PHP limits for large document uploads.
; Read automatically by PHP running as CGI/FastCGI/LSAPI (the normal cPanel
; setup). Changes take effect within user_ini.cache_ttl (usually 5 minutes).
; If your host runs mod_php instead, the same values are set in .htaccess.

upload_max_filesize = 256M
post_max_size = 260M
memory_limit = 256M
max_execution_time = 300
max_input_time = 600
max_file_uploads = 20
