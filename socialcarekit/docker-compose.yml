# SocialCareKit — local test environment.
# One command: docker compose up --build
# Site: http://localhost:8080  ·  first-run admin setup: http://localhost:8080/setup.php
# The database auto-imports schema.sql + seed.sql on first start.

services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: socialcarekit
      MARIADB_USER: sck
      MARIADB_PASSWORD: sckpass
      MARIADB_ROOT_PASSWORD: rootpass
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
